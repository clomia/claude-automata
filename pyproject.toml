[project]
name = "claude-automata"
version = "0.1.1"
description = "One-command setup for the claude-automata ecosystem — Claude Code settings, marketplace, plugins, external CLIs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "clomia", email = "clomia.sig@gmail.com" }]
keywords = ["claude", "claude-code", "setup", "plugins", "marketplace"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.14"
dependencies = []

[project.urls]
Homepage = "https://github.com/clomia/claude-automata"
Repository = "https://github.com/clomia/claude-automata"

[project.scripts]
claude-automata = "claude_automata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_automata"]

[tool.hatch.build.targets.wheel.force-include]
".claude-plugin/marketplace.json" = "claude_automata/marketplace.json"

[tool.hatch.build.targets.sdist]
include = ["claude_automata", ".claude-plugin/marketplace.json"]

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.15.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
