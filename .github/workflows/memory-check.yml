# Seeded by the tx plugin (clomia/claude-automata) — seed-owned: the seed
# overwrites this file whole whenever it differs from the plugin's copy.
name: memory-check

on: pull_request

jobs:
  openspec-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: openspec validate
        if: hashFiles('openspec/config.yaml') != ''
        run: npx --yes @fission-ai/openspec@1.7.0 validate --all --strict --no-interactive

  docs-form-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the merge commit plus both parents — HEAD^1 is the base head
          fetch-depth: 2
      - name: docs form check
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          def sh(*args):
              return subprocess.run(args, capture_output=True, text=True)

          tracked = sh("git", "ls-files").stdout.splitlines()
          md = [f for f in tracked if f.endswith(".md")]

          # openspec/changes/archive/** is frozen memory: form is gated when a
          # PR brings a file in, never re-judged against present-day rules.
          ARCHIVE = "openspec/changes/archive/"
          diff = sh("git", "diff", "--name-only", "--no-renames",
                    "--diff-filter=AM", "HEAD^1", "HEAD")
          if diff.returncode != 0:
              print("cannot resolve the PR diff (HEAD^1..HEAD)", file=sys.stderr)
              sys.exit(1)
          entering = set(diff.stdout.splitlines())
          md = [f for f in md if not f.startswith(ARCHIVE) or f in entering]

          research = [f for f in md if "/docs/research/" in "/" + f]
          violations = []

          name_re = re.compile(r"-[0-9]{4}(-[0-9]{2})?\.md$")
          for f in research:
              if not name_re.search(f.rsplit("/", 1)[-1]):
                  violations.append(f + ": research filename must end with -<yyyy>[-<mm>].md")

          link_re = re.compile(r"\]\(([^()\s]+)\)")
          span_re = re.compile(r"`([^`\n]+)`")
          scheme_re = re.compile(r"^[A-Za-z][A-Za-z0-9+.\-]*://")
          space_re = re.compile(r"\s")

          def path_tokens(text):
              raw = link_re.findall(text) + span_re.findall(text)
              return [t for t in raw
                      if "/" in t and not space_re.search(t) and not scheme_re.match(t)]

          for f in md:
              text = Path(f).read_text(encoding="utf-8", errors="replace")
              for token in dict.fromkeys(path_tokens(text)):
                  if token.startswith("/tmp/"):
                      violations.append(f + ": references /tmp/ path " + token)
                  elif sh("git", "check-ignore", "-q", "--", token).returncode == 0:
                      violations.append(f + ": references gitignored path " + token)

          date_re = re.compile(r"^[-*]?\s*Date\s*:")
          method_re = re.compile(r"^[-*]?\s*Method\s*:")
          for f in research:
              head = Path(f).read_text(encoding="utf-8", errors="replace").splitlines()[:20]
              if not any(date_re.search(line) for line in head):
                  violations.append(f + ": missing 'Date:' line in first 20 lines")
              if not any(method_re.search(line) for line in head):
                  violations.append(f + ": missing 'Method:' line in first 20 lines")

          if violations:
              print("\n".join(violations))
              sys.exit(1)
          print("docs form: clean")
          PY
