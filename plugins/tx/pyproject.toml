[project]
name = "tx"
version = "0.13.1"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
base = "src.repo:print_base"
base-commit-block = "src.commit_guard:main"
branch-protect-block = "src.protect:main"
branch-state-warn = "src.state:main"
git-sync = "src.sync:main"
git-sync-off = "src.pause:off"
git-sync-on = "src.pause:on"
open-tx = "src.open_tx:main"
openspec = "src.openspec:main"
seed = "src.seed:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "src"

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.15.9"]
