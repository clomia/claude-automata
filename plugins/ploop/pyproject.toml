[project]
name = "ploop"
version = "0.7.0"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.12.5"]

[project.scripts]
ploop-stop = "src.main:stop"
ploop-pre-tool-use = "src.main:pre_tool_use"
ploop-user-prompt-submit = "src.main:user_prompt_submit"
ploop-mark-compaction = "src.main:mark_compaction"
ploop-update-check = "src.updater:check_for_update"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "src"

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.15.9"]
