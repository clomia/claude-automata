[project]
name = "ploop"
version = "0.46.4"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
stop = "src.main:stop"
pre-tool-use = "src.main:pre_tool_use"
subagent-stop = "src.main:subagent_stop"
mark-compaction = "src.main:mark_compaction"
launch = "src.main:launch"
off-command = "src.main:off_command"
on-command = "src.main:on_command"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "src"

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.15.9"]
