[project]
name = "txgit"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
branch-protect-block = "src.protect:main"
branch-state-warn = "src.state:main"
git-sync = "src.sync:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "src"

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.15.9"]
