[project]
name = "parallax-loop"
version = "0.6.0"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.12.5"]

[project.scripts]
parallax-loop-stop = "src.main:stop"
parallax-loop-pre-tool-use = "src.main:pre_tool_use"
parallax-loop-user-prompt-submit = "src.main:user_prompt_submit"
parallax-loop-mark-compaction = "src.main:mark_compaction"
parallax-loop-update-check = "src.updater:check_for_update"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "src"

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.15.9"]
