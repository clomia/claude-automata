[project]
name = "version-up-alert"
version = "0.2.4"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
update-check = "src.updater:check_for_update"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "src"

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.15.9"]
