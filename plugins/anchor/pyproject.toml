[project]
name = "anchor"
version = "0.1.12"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.12.5"]

[project.scripts]
anchor-subagent-stop = "src.hooks:subagent_stop"
anchor-pre-tool-use = "src.hooks:pre_tool_use"
anchor-update-check = "src.updater:check_for_update"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "src"

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.15.9"]
